version: "3.9"
services:
  openhouse_app:
    image: kmutt_oph_prod
    container_name: kmutt-openhouse-app-prod
    ports:
      - "80:80"
    env_file:
      - .env
    environment:
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - EXTERNAL_JWT_SECRET=${EXTERNAL_JWT_SECRET}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
    depends_on:
       - openhouse_db

  openhouse_db:
    image: mysql:8.0
    container_name: kmutt-oph-db-prod
    restart: always
    volumes:
     - ./mysql-data-prod:/var/lib/mysql
    environment:
     MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_PROD}
     MYSQL_DATABASE: kmutt-openhouse-act-prod
    expose:
     - "3306"
    ports:
     - "3308:3306"

  PMA:
    depends_on:
     - openhouse_db
    image: phpmyadmin/phpmyadmin
    container_name: kmutt-oph-pma-prod
    restart: always
    ports:
     - "9091:80"
    environment:
      PMA_HOST: openhouse_db
