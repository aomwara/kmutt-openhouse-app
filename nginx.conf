upstream openhouse_app {
    ip_hash;  # sticky session
    server openhouse_app_ex:80;
    server openhouse_app_ex_2:80;
    server openhouse_app_ex_3:80;
}

server {
    listen 80;
    server_name _;
    
    location /sit-certificate/ {
        alias /sit-cert/;
        autoindex off;            # ถ้าอยาก list ไฟล์ให้ on
        add_header Content-Type application/pdf;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://openhouse_app;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # Simple Nginx metrics for Prometheus
    location /nginx_status {
        stub_status;
        allow all;
    }

    # Log for traffic estimation per container
    access_log /var/log/nginx/access.log main;
}
